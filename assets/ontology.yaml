# Lines of an order that are not goods (folded product-name regex). Not rankable, no quantity;
# whether they count in revenue is decided by RuleSpec.revenue (service fee: yes by default).
non_item_lines:
  service_fee: "^phi phuc vu"
  order_discount: "^(voucher|dung \\d+ diem|giam gia (don|hoa don)|khuyen mai (don|hoa don)|ma giam gia)"
  shipping: "^(phi ship|phi giao hang|phi van chuyen|tien ship)"

# Order status vocabulary (folded regex, checked in this order) -> the 4 rulebook statuses (+ other).
status_vocabulary:
  canceled: "\\b(khong giao duoc|giao that bai|huy|da huy|bi huy|huy don|cancel|canceled|cancelled|boom|bom hang|that bai|failed|void|khach huy)\\b"
  returned: "\\b(tra hang|tra lai|tra ve|hang tra ve|bi tra|hoan hang|hoan tra|doi tra|return|returned|refund|hoan tien|khach tra|mang tra|tra may|tra do)\\b"
  pending: "\\b(dang giao|dang van chuyen|dang ship|cho giao|cho xac nhan|cho lay|chua giao|dang xu ly|pending|processing|shipping|delivering|dang)\\b"
  completed: "\\b(hoan thanh|da hoan thanh|thanh cong|da giao|giao thanh cong|giao xong|da lay|da nhan|xong|completed|complete|done|success|ok|paid|delivered|da thanh toan|hoan tat|binh thuong)\\b"
# order status written in a free-text note (books without a status column, rulebook §8): stricter than
# status_vocabulary so that "kiểm tra lại", "khách chờ lấy" stay completed
status_note_vocabulary:
  canceled: "(^|[^a-z])(huy|da huy|bi huy|huy don|khach huy|khong lay|bom hang|boom)([^a-z]|$)"
  returned: "(^|[^a-z])(tra lai hang|khach tra lai|khach mang tra|mang tra lai|tra hang|hang tra ve|hoan hang|hoan tra|doi tra)([^a-z]|$)"
  pending: "(^|[^a-z])(dang giao|chua giao|dang ship|dang van chuyen|cho giao)([^a-z]|$)"
